name: YAi derleme

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q

  android-apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.YAI_KEYSTORE_B64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - name: Testler (ekran görüntüleri dahil)
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: İmza anahtarı (varsa)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/yai.keystore && echo "YAI_KEYSTORE=$RUNNER_TEMP/yai.keystore" >> $GITHUB_ENV
      - name: APK derle
        env:
          YAI_KEYSTORE_PASSWORD: ${{ secrets.YAI_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YAi-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YAi-ekranlar
          path: android/app/build/screens/
