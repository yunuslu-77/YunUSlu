[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yworkspace"
version = "0.1.0"
description = "Her yapay zekâya tam bir geliştirme ortamı / A full working environment for every AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Yunus Emre USLU" }]
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

# Claude support uses the official SDK; install with: pip install "yworkspace[claude]"

[project.optional-dependencies]
claude = ["anthropic>=2.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
bridge = ["pyautogui>=0.9", "pynput>=1.7", "uiautomation>=2.0; sys_platform == 'win32'",
          "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'"]
mcp = ["mcp>=1.0"]
data = ["pandas>=2.1", "numpy>=1.26", "openpyxl>=3.1"]
office = ["python-docx>=1.1", "python-pptx>=0.6.23", "openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
yw = "yworkspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yworkspace = ["**/*.json", "**/*.yaml", "**/*.md", "**/*.html", "**/*.js", "**/*.css", "**/*.png", "**/*.webmanifest", "**/Dockerfile",
              "saas_kit/templates/**/*", "saas_kit/templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Depends"]
