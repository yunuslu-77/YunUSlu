[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yworkspace"
version = "0.1.0"
description = "Her yapay zekâya tam bir geliştirme ortamı / A full working environment for every AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Yunus Emre USLU" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
yw = "yworkspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yworkspace = ["**/*.json", "**/*.yaml", "**/*.md", "**/*.html", "**/*.js", "**/*.css", "**/Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
