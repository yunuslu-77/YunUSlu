{% extends "base.html" %}
{% block content %}
<h1>{{ t('account') }}</h1>
<section class="card narrow">
  <p>{{ user.email }}</p>
  <p><a class="button" href="/account/export">{{ t('export') }}</a></p>
</section>
<section class="card narrow danger-zone">
  <h2>{{ t('delete_account') }}</h2>
  <form method="post" action="/account/delete">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="confirm">{{ t('confirm_delete') }}</label><input id="confirm" name="confirm" autocomplete="off">
    <button class="danger">{{ t('delete_account') }}</button>
  </form>
</section>
{% endblock %}
