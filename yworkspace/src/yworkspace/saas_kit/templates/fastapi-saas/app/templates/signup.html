{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('signup') }}</h1>
  <form method="post" action="/signup">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="name">{{ t('name') }}</label><input id="name" name="name" value="{{ form.name if form else '' }}" autocomplete="name">
    <label for="email">{{ t('email') }}</label><input id="email" name="email" type="email" required value="{{ form.email if form else '' }}" autocomplete="email">
    <label for="password">{{ t('password') }}</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
    <label for="org_name">{{ t('org_name') }}</label><input id="org_name" name="org_name" value="{{ form.org_name if form else '' }}">
    <button class="primary">{{ t('signup') }}</button>
  </form>
  <p><a href="/login">{{ t('login') }}</a></p>
</section>
{% endblock %}
