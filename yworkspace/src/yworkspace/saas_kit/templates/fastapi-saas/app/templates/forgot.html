{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('forgot') }}</h1>
  <form method="post" action="/forgot">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">{{ t('email') }}</label><input id="email" name="email" type="email" required>
    <button class="primary">{{ t('reset') }}</button>
  </form>
</section>
{% endblock %}
