{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('login') }}</h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
    <label for="email">{{ t('email') }}</label><input id="email" name="email" type="email" required autocomplete="email">
    <label for="password">{{ t('password') }}</label><input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="primary">{{ t('login') }}</button>
  </form>
  <p><a href="/forgot">{{ t('forgot') }}</a> · <a href="/signup">{{ t('signup') }}</a></p>
</section>
{% endblock %}
